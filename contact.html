<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact | My Fitness Recipes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrapper">

    <header>
        <h1>Contact Me</h1>
        <nav>
            <a href="HomePage.html">Home</a>
            <a href="bulk.html">Bulking Recipes</a>
            <a href="cut.html">Cutting Recipes</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h2>Get in Touch</h2>
            <p>
                What did you think of the recipes? Have any questions or suggestions? Feel free to reach out using the form below!
            </p>
        </section>

        <section class="about-site">
            <h2>Contact Form</h2>

            <form class="contact-form">

                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your full name">

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email">

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="(123) 456-7890">

                <label for="comment">Your Message</label>
                <textarea id="comment" rows="5" placeholder="Write your message here..."></textarea>

                <button type="button" class="submit-btn">Submit</button>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; Christopher Lara Navarro 2025</p>
    </footer>

</div>
</body>
</html>
